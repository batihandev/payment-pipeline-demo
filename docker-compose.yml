name: payment-pipeline-demo
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: testnet
      POSTGRES_PASSWORD: local_testnet
      POSTGRES_DB: testnet_payments
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U testnet -d testnet_payments']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.8-alpine
    ports:
      - '127.0.0.1:56379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
  redis_data:
