# The demo stack: its own Postgres and Redis, the three app services from one
# image, a one-shot migrate service and a Cloudflare Tunnel connector.
# Values come from deploy/.env, read with --env-file; deploy.sh sets IMAGE_TAG.
# Nothing publishes a port: the tunnel reaches the API at http://api:3000.
name: payment-pipeline-demo-deploy

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  logging: *logging

x-app: &app
  <<: *hardening
  image: ${IMAGE:-ghcr.io/batihandev/payment-pipeline-demo}:${IMAGE_TAG:?IMAGE_TAG is set by deploy.sh}
  tmpfs: ['/tmp:size=16m']
  deploy:
    resources:
      limits:
        memory: 256m
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

x-connection: &connection
  DATABASE_URL: postgresql://testnet:${POSTGRES_PASSWORD:?}@postgres:5432/testnet_payments
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379

x-chain: &chain
  CHAIN_ID: ${CHAIN_ID:?}
  RPC_URL: ${RPC_URL:?}
  USDC_ADDRESS: ${USDC_ADDRESS:?}

services:
  postgres:
    <<: *hardening
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    user: postgres
    command: ['postgres', '-c', 'shared_buffers=64MB']
    environment:
      POSTGRES_USER: testnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: testnet_payments
    volumes:
      - postgres_data:/var/lib/postgresql
    tmpfs:
      - /tmp:size=16m
      - /var/run/postgresql:size=1m,uid=70,gid=70,mode=0775
    shm_size: 128m
    deploy:
      resources:
        limits:
          memory: 256m
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'testnet', '-d', 'testnet_payments']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

  redis:
    <<: *hardening
    image: redis:8.8-alpine@sha256:dc95ea2fcf5d5c4253be0f967c28143d0f625846197eed2fd32c748eb99abfca
    user: redis
    # BullMQ needs noeviction: an evicted key would lose a job.
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDISCLI_AUTH" --maxmemory 48mb --maxmemory-policy noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 64m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
      start_interval: 1s

  migrate:
    <<: *hardening
    image: ${IMAGE:-ghcr.io/batihandev/payment-pipeline-demo}:${IMAGE_TAG:?IMAGE_TAG is set by deploy.sh}-migrate
    profiles: [migrate]
    restart: 'no'
    tmpfs: ['/tmp:size=16m']
    environment:
      DATABASE_URL: postgresql://testnet:${POSTGRES_PASSWORD:?}@postgres:5432/testnet_payments
      CHECKPOINT_DISABLE: '1'
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ['node', 'dist/apps/api/apps/api/src/main.js']
    environment:
      <<: [*connection, *chain]
      API_HOST: 0.0.0.0
      CLIENT_IP_HEADER: cf-connecting-ip
      BUYER_ADDRESS: ${BUYER_ADDRESS:?}
      SHOP_ADDRESS: ${SHOP_ADDRESS:?}
      NOTICE_SECRET: ${NOTICE_SECRET:?}
      WEB_ORIGIN: ${WEB_ORIGIN:?}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?}
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  tracker:
    <<: *app
    command: ['node', 'dist/apps/tracker/apps/tracker/src/main.js']
    environment:
      <<: [*connection, *chain]
      BUYER_ADDRESS: ${BUYER_ADDRESS:?}
      SHOP_ADDRESS: ${SHOP_ADDRESS:?}
      NOTICE_SECRET: ${NOTICE_SECRET:?}
      SHOP_NOTICE_URL: http://api:3000/shop/notices
    stop_grace_period: 60s

  buyer:
    <<: *app
    command: ['node', 'dist/apps/buyer/apps/buyer/src/main.js']
    environment:
      <<: [*connection, *chain]
      BUYER_PRIVATE_KEY: ${BUYER_PRIVATE_KEY:?}
      SHOP_PRIVATE_KEY: ${SHOP_PRIVATE_KEY:?}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?}
    stop_grace_period: 60s

  cloudflared:
    <<: *hardening
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    # Off when COMPOSE_PROFILES leaves out "tunnel", as on a machine with no tunnel.
    profiles: [tunnel]
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  postgres_data:
  redis_data:
